name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install wabt (wat2wasm)
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Rebuild .wasm from .wat sources
        run: npm run build
      - name: Fail if committed .wasm drifted from .wat sources
        run: git diff --exit-code -- '*.wasm'
      - run: npm run examples
